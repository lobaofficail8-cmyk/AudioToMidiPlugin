name: Build plugin
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build
      - run: cmake --build build --config Release --target AudioToMidi_VST3 AudioToMidi_Standalone
      - uses: actions/upload-artifact@v4
        with:
          name: AudioToMidi-Windows
          path: build/AudioToMidi_artefacts/Release/**
